<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg.png" alt="">
            <h2 class="titulo-principal"> Gerador de Senhas</h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">Senha</label>
            <input name="senha" type="text" id="campo-senha" readonly>
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Numero de Caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Caracteristicas da Sanha</h4>
                    <div class="parametro-senha__checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" checked>
                        <label for="maiusculo">Letras Maiusculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="minusculo" type="checkbox" class="checkbox">
                        <label for="mimusculo">Letras Minusculas</label>
                    </div>
                    <div class="parametro-senha__checkbox">
                        <input name="numero" type="checkbox" class="checkbox" checked>
                        <label for="Numero">Letras Maiusculas</label>
                    </div>
                    <div class="parametro-senha__checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox" checked>
                        <label for="simbolo">Letras Maiusculas</label>
                </div>
            </div>
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo">força da senha</h4>
                <div class="barra"></div>
                <div class="forca-fraca"></div>
                <div class="parametro-senha-texto">
                <p>frac</p>
                <p>media</p>
                <p>forte</p>
                </div>
                <p class="entropia"></p>
            </div>
        </div>   
    </section>
    <script src="scripit.js"></script>
    
</body>
</html>
